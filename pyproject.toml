[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "voxops"
version = "0.1.0"
description = "Local Stage 1 repository intelligence and isolated worktrees"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3", "langgraph>=1,<2",
  "pydantic-ai-slim[anthropic,openai]>=1,<2", "httpx>=0.28,<1",
]

[project.scripts]
voxops = "voxops.main:run"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
